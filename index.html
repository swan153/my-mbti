<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 도감 - MBTI 포켓몬 찾기</title>
  <style>
    :root {
      --pokedex-red: #dc2626;
      --pokedex-dark-red: #991b1b;
      --pokedex-accent: #facc15;
      --screen-bg: #fefce8;
      --screen-border: #475569;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    body {
      background-color: #fef9c3;
      background-image: radial-gradient(#fde047 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 포켓몬 도감 프레임 */
    .pokedex-container {
      background: linear-gradient(145deg, #ef4444, #b91c1c);
      border: 6px solid #7f1d1d;
      border-radius: 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2), inset 0 4px 6px rgba(255, 255, 255, 0.3);
      max-width: 580px;
      width: 100%;
      padding: 24px;
      position: relative;
    }

    /* 도감 상단 센서/라이트 부 */
    .pokedex-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 4px solid #991b1b;
    }

    .main-sensor {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 35% 35%, #60a5fa, #1d4ed8);
      border: 5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #3b82f6, 0 4px 6px rgba(0,0,0,0.3);
      animation: pulse 2s infinite alternate;
    }

    .sub-lights {
      display: flex;
      gap: 8px;
    }

    .light {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #7f1d1d;
    }
    .light.red { background: #ef4444; box-shadow: 0 0 5px #ef4444; }
    .light.yellow { background: #facc15; box-shadow: 0 0 5px #facc15; }
    .light.green { background: #22c55e; box-shadow: 0 0 5px #22c55e; }

    /* 메인 스크린 */
    .pokedex-screen {
      background-color: var(--screen-bg);
      border: 6px solid var(--screen-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .screen-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .screen-title h1 {
      font-size: 1.8rem;
      color: #991b1b;
      font-weight: 800;
      text-shadow: 1px 1px 0px #fde047;
      margin-bottom: 6px;
    }

    .screen-title p {
      font-size: 1rem;
      color: #4b5563;
      font-weight: 600;
    }

    /* MBTI 선택 그리드 */
    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* 포켓볼 스타일 버튼 */
    .mbti-btn {
      background: linear-gradient(180deg, #ef4444 48%, #334155 48%, #334155 52%, #ffffff 52%);
      border: 3px solid #1e293b;
      border-radius: 12px;
      padding: 12px 6px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      box-shadow: 0 4px 0 #1e293b;
    }

    .mbti-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #ffffff;
      border: 3px solid #1e293b;
      border-radius: 50%;
    }

    .mbti-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1e293b;
      filter: brightness(1.1);
    }

    .mbti-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e293b;
    }

    /* 결과 페이지 스타일 */
    .result-container {
      display: none;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .pokemon-card {
      background-color: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .pokemon-image-box {
      width: 180px;
      height: 180px;
      margin: 0 auto 12px;
      background: radial-gradient(circle, #fef08a 0%, #fef9c3 100%);
      border: 4px dashed #facc15;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .pokemon-svg {
      width: 130px;
      height: 130px;
      filter: drop-shadow(0 8px 6px rgba(0,0,0,0.15));
    }

    .mbti-badge {
      display: inline-block;
      background-color: #dc2626;
      color: white;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .pokemon-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .pokemon-desc {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #334155;
      text-align: left;
      background-color: #f8fafc;
      padding: 14px;
      border-radius: 10px;
      border-left: 4px solid #ef4444;
      word-break: keep-all;
    }

    /* 궁합 카드 */
    .compatibility-box {
      background-color: #fef2f2;
      border: 2px dashed #f87171;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .compatibility-title {
      font-weight: 700;
      color: #991b1b;
      font-size: 0.95rem;
    }

    .compatibility-mbti {
      background-color: #ef4444;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
    }

    /* 다시 고르기 버튼 */
    .reset-btn {
      width: 100%;
      background: linear-gradient(180deg, #eab308, #ca8a04);
      color: white;
      border: 3px solid #713f12;
      border-radius: 12px;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #713f12;
      transition: all 0.15s ease;
      text-shadow: 1px 1px 0px #000;
    }

    .reset-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #713f12;
    }

    .reset-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #713f12;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 8px #3b82f6; }
      100% { box-shadow: 0 0 18px #60a5fa, 0 0 25px #3b82f6; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 480px) {
      .mbti-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .pokedex-container {
        padding: 16px;
      }
      .pokedex-screen {
        padding: 16px;
      }
    }
  </style>
</head>

        compat: "ENFP",
        desc: "독립적이고 완벽한 전략을 세우는 철저한 분석가! 치밀하고 압도적인 능력을 지닌 뮤츠와 높은 싱크로율을 보입니다."
      },
      ISFP: {
        name: "이브이 🦊",
        svg: pokemonSvgs.eevee,
        compat: "ESFJ",
        desc: "온순하고 예술적 감각이 뛰어나며 무궁무진한 가능성을 지닌 유형! 다양한 모습으로 진화할 수 있는 이브이 그 자체입니다."
      },
      ISTP: {
        name: "파이리 🔥",
        svg: pokemonSvgs.charmander,
        compat: "ESFP",
        desc: "조용하지만 실전에 강하고 도구를 다루는 데 유연한 마이웨이! 상황에 따라 유연하게 불꽃을 피우는 파이리와 닮았습니다."
      },
      ISFJ: {
        name: "잠만보 💤",
        svg: pokemonSvgs.snorlax,
        compat: "ESTP",
        desc: "수호자처럼 묵묵히 자리를 지키며 차분하고 포근한 쉼터를 주는 성향! 따뜻하고 안락함을 전달하는 잠만보 스타일입니다."
      },
      ISTJ: {
        name: "암나이트 🐚",
        svg: pokemonSvgs.generic,
        compat: "ESFP",
        desc: "원칙을 준수하고 원리원칙에 충실하며 신뢰를 최우선하는 원조 길잡이! 변함없이 견고한 가치를 지켜냅니다."
      }
    };

    // MBTI 선택 버튼 생성
    const mbtiList = ["ENFP", "ENTP", "ENFJ", "ENTJ", "ESFP", "ESTP", "ESFJ", "ESTJ", "INFP", "INTP", "INFJ", "INTJ", "ISFP", "ISTP", "ISFJ", "ISTJ"];
    const gridContainer = document.getElementById("mbti-grid");

    mbtiList.forEach(mbti => {
      const btn = document.createElement("button");
      btn.className = "mbti-btn";
      btn.innerText = mbti;
      btn.onclick = () => showResult(mbti);
      gridContainer.appendChild(btn);
    });

    // 결과 출력 함수
    function showResult(mbti) {
      const data = mbtiPokemonData[mbti];
      
      document.getElementById("res-mbti").innerText = `[${mbti}]`;
      document.getElementById("res-name").innerText = data.name;
      document.getElementById("res-img-container").innerHTML = data.svg;
      document.getElementById("res-desc").innerText = data.desc;
      document.getElementById("res-compat").innerText = data.compat;

      document.getElementById("selection-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "block";
    }

    // 다시 선택 함수
    function resetSelection() {
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("selection-screen").style.display = "block";
    }
  </script>
</body>
</html>
