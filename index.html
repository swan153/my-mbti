<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 나의 포켓몬 찾기</title>
    <style>
        /* 글로벌 스타일 및 따뜻한 크림/노랑 톤 테마 설정 */
        :root {
            --bg-cream: #FFFDF5;
            --card-bg: #FFFFFF;
            --primary-yellow: #FFE169;
            --accent-orange: #FF9F1C;
            --text-dark: #4A3E3D;
            --text-muted: #7A6F6D;
            --shadow: 0 10px 25px -5px rgba(230, 180, 80, 0.25), 0 8px 10px -6px rgba(230, 180, 80, 0.15);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        /* 헤더 스타일 */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background-color: #FFF3C4;
            color: #D97706;
            font-size: 1rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 12px;
            border: 2px solid #FDE68A;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #362D2C;
            margin-bottom: 10px;
            word-break: keep-all;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            word-break: keep-all;
        }

        /* 메인 카드 영역 */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            box-shadow: var(--shadow);
            border: 3px solid #FEF3C7;
            transition: all 0.3s ease;
        }

        /* 화면 전환 효과 */
        .page {
            display: none;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .page.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* MBTI Grid 선택 버튼 */
        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            h1 { font-size: 1.8rem; }
            .card { padding: 24px 16px; }
        }

        .mbti-btn {
            background-color: #FFFBEB;
            border: 2px solid #FDE68A;
            border-radius: var(--radius-md);
            padding: 16px 8px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #B45309;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(251, 191, 36, 0.1);
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .mbti-btn .sub-text {
            font-size: 0.75rem;
            font-weight: 500;
            color: #D97706;
        }

        .mbti-btn:hover {
            background-color: var(--primary-yellow);
            border-color: var(--accent-orange);
            color: #78350F;
            transform: translateY(-3px);
            box-shadow: 0 8px 12px -2px rgba(245, 158, 11, 0.25);
        }

        .mbti-btn:active {
            transform: translateY(0);
        }

        /* 결과 화면 스타일 */
        .result-container {
            text-align: center;
        }

        .result-tag {
            display: inline-block;
            background-color: #FEF3C7;
            color: #B45309;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 50px;
            margin-bottom: 16px;
        }

        .pokemon-emoji {
            font-size: 6rem;
            line-height: 1.1;
            margin: 10px 0 16px 0;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.1));
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .pokemon-name {
            font-size: 2.2rem;
            font-weight: 800;
            color: #292524;
            margin-bottom: 20px;
        }

        .reason-box {
            background-color: #FFFBEB;
            border-left: 5px solid var(--accent-orange);
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 28px;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }

        .reason-box h3 {
            font-size: 1.15rem;
            color: #92400E;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reason-box p {
            font-size: 1.05rem;
            color: #44403C;
            word-break: keep-all;
            white-space: pre-line;
        }

        /* 궁합 영역 */
        .match-box {
            background-color: #F0FDF4;
            border: 2px solid #BBF7D0;
            border-radius: var(--radius-md);
            padding: 18px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
        }

        .match-emoji {
            font-size: 2.8rem;
            background-color: #DCFCE7;
            padding: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .match-info h4 {
            font-size: 0.95rem;
            color: #166534;
            margin-bottom: 2px;
        }

        .match-info .match-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #14532D;
            margin-bottom: 4px;
        }

        .match-info p {
            font-size: 0.95rem;
            color: #15803D;
            word-break: keep-all;
        }

        /* 버튼 스타일 */
        .reset-btn {
            background-color: var(--accent-orange);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 159, 28, 0.35);
            width: 100%;
            max-width: 280px;
        }

        .reset-btn:hover {
            background-color: #E08700;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 159, 28, 0.45);
        }

        .reset-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

            </div>
        </main>

            { type: "INFP", name: "잔다르크" }, { type: "INTP", name: "아이디어" },
            { type: "ESTP", name: "수환형" }, { type: "ESFP", name: "사교형" },
            { type: "ENFP", name: "스파크" }, { type: "ENTP", name: "발명가" },
            { type: "ESTJ", name: "사업가" }, { type: "ESFJ", name: "친선도모" },
            { type: "ENFJ", name: "언변능숙" }, { type: "ENTJ", name: "지도자" }
        ];

        window.onload = function() {
            renderButtons();
        };

        // 16개 MBTI 버튼 그리드 생성
        function renderButtons() {
            const container = document.getElementById("mbti-grid-container");
            container.innerHTML = "";

            Object.keys(pokemonData).forEach(mbti => {
                const btn = document.createElement("button");
                btn.className = "mbti-btn";
                btn.innerHTML = `
                    <span>${mbti}</span>
                `;
                btn.onclick = () => selectMBTI(mbti);
                container.appendChild(btn);
            });
        }

        // MBTI 선택 시 결과 출력
        function selectMBTI(mbti) {
            const data = pokemonData[mbti];
            if (!data) return;

            // 결과 데이터 채우기
            document.getElementById("res-mbti-tag").textContent = `✨ 나의 MBTI: ${mbti}`;
            document.getElementById("res-emoji").textContent = data.emoji;
            document.getElementById("res-name").textContent = data.name;
            document.getElementById("res-reason").innerText = data.reason;

            // 궁합 데이터 채우기
            document.getElementById("res-match-emoji").textContent = data.matchEmoji;
            document.getElementById("res-match-title").textContent = `${data.matchMBTI} (${data.matchPokemon})`;
            document.getElementById("res-match-desc").textContent = data.matchDesc;

            // 화면 전환
            const selectPage = document.getElementById("selection-page");
            const resultPage = document.getElementById("result-page");

            selectPage.classList.remove("active");
            setTimeout(() => {
                resultPage.classList.add("active");
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 200);
        }

        // 다시 고르기 (선택 화면으로 이동)
        function showSelectionPage() {
            const selectPage = document.getElementById("selection-page");
            const resultPage = document.getElementById("result-page");

            resultPage.classList.remove("active");
            setTimeout(() => {
                selectPage.classList.add("active");
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 200);
        }
    </script>
</body>
</html>
